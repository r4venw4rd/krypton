[workspace]
resolver = "2"
members = ["crates/core", "crates/crypto", "crates/cli", "crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["r4venw4rd"]
repository = "https://github.com/r4venw4rd/krypton"
rust-version = "1.85"
readme = "../../README.md"
keywords = ["password-manager", "security", "encryption", "totp", "local-first"]
categories = ["cryptography", "command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# serde_derive uses syn 2 while thiserror's proc macro uses syn 3; both are
# transitive, so the duplicate cannot be removed from this workspace.
multiple_crate_versions = "allow"

[workspace.dependencies]
krypton-core = { path = "crates/core" }
krypton-crypto = { path = "crates/crypto" }

anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
base32 = "0.5"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
getrandom = { version = "0.2", features = ["std"] }
hkdf = "0.12"
hmac = "0.12"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
